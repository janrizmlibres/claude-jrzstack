# The upstream sync, started only by hand (`gh workflow run sync-upstream.yml`),
# from a session that oversees the run and reviews its PR. A shell gate decides
# without a model call: it stops when upstream matches the snapshot, and
# comments on an open sync PR instead of starting another. Otherwise Claude runs the repo-local /sync-upstream skill
# at the upstream commit the gate saw, which opens one PR on sync/<version>
# against the branch this run is on. Nothing merges itself.
#
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret (from `claude setup-token`) and the
# repo setting "Allow GitHub Actions to create and approve pull requests".
# Sync PRs are opened with the default GITHUB_TOKEN: no GitHub App or PAT.
name: Sync upstream

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/sync-gate.ts
      - name: Commit identity
        if: steps.gate.outputs.sync == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
      - name: Sync
        if: steps.gate.outputs.sync == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "/sync-upstream ${{ steps.gate.outputs.commit }}"
          # Print the transcript: a denied tool call is otherwise only a count.
          show_full_output: true
          # The skill's own commands: the repo scripts, git, reading upstream's
          # commits and PRs, opening the PR, and re-copying the vendored
          # commander (npm pack, tar, cp) when upstream moves its pin.
          # A path prefix takes a bare trailing * : `:*` (like ` *`) needs a space
          # after the prefix, so `bun scripts/:*` never matched `bun scripts/x.ts`.
          claude_args: |
            --model opus
            --allowedTools "Read,Write,Edit,Glob,Grep,Agent,Bash(bun scripts/*),Bash(bun run:*),Bash(git:*),Bash(gh api repos/cursor/plugins/*),Bash(gh pr create:*),Bash(npm pack:*),Bash(tar:*),Bash(mkdir:*),Bash(cp:*),Bash(rm:*),Bash(ls:*)"
      # The action reports success even when Claude stopped early, so the run
      # is only green when a sync PR for this version is open.
      - name: Check the sync PR
        if: steps.gate.outputs.sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          pr=$(gh pr list --state open --json headRefName,url \
            --jq "map(select(.headRefName | startswith(\"sync/$VERSION\")))[0].url // empty")
          if [ -z "$pr" ]; then
            echo "::error::Claude finished without opening a sync PR for pstack $VERSION. Read the transcript in the Sync step."
            exit 1
          fi
          echo "Sync PR: $pr"
